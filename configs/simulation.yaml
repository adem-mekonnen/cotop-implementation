# Simulation Constants (Verified from Table III, Journal Page 5550)

# Ranges (Sample these per vehicle/task/RSU in the environment)
num_vehicles_range: [10, 30]
vehicle_speed_range: [30, 40]                  # m/s
rsu_cpu_capacity_range: [1.0e9, 4.0e9]         # Cycles/s
num_tasks_per_vehicle_range: [20, 40]
task_size_range: [2.0e6, 5.0e6]                # Bytes (Converted from MB)
task_deadline_range: [20, 30]                  # Seconds
bandwidth_v2r_range: [20.0e6, 100.0e6]         # Hz (From Mbps range)

# Constants
num_rsus: 6
rsu_comm_range: 400.0                          # m
bandwidth_r2r: 50.0e6                          # Hz (From 50 MHz)
tx_power_vehicle: 0.01                         # Watts (From 10 dBm)
tx_power_rsu: 100.0                            # Watts (From 50 dBm)
noise_power: 0.001                             # Watts (From 0.001 dBm)
fixed_loss_k: 1000.0                           # Ratio (From 30 dB)
path_loss_factor: 2.0                          # sigma

# Optimization Weights
alpha: 0.3
beta: 0.7
