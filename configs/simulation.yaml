# Simulation Constants (Verified from Table III, Journal Page 5550)

# Ranges (Sample these per vehicle/task/RSU in the environment)
num_vehicles_range: [10, 30]
vehicle_speed_range: [30.0, 40.0]              # m/s
rsu_cpu_capacity_range: [1000000000.0, 4000000000.0]  # Cycles/s (1e9 to 4e9)
num_tasks_per_vehicle_range: [20, 40]
task_size_range: [2000000.0, 5000000.0]        # Bytes (2e6 to 5e6)
task_deadline_range: [20.0, 30.0]              # Seconds
bandwidth_v2r_range: [20000000.0, 100000000.0] # Hz (20e6 to 100e6)

# Constants
num_rsus: 6
rsu_comm_range: 400.0                          # m
bandwidth_r2r: 50000000.0                      # Hz (50e6)
tx_power_vehicle: 0.01                         # Watts (From 10 dBm)
tx_power_rsu: 100.0                            # Watts (From 50 dBm)
noise_power: 0.001                             # Watts (From 0.001 dBm)
fixed_loss_k: 1000.0                           # Ratio (From 30 dB)
path_loss_factor: 2.0                          # sigma
max_task_cpu: 10.0                             # Mcycles, Section III-F cap

# Optimization Weights
alpha: 0.3                                     # Eq. 23 priority weight
beta: 0.7                                      # Eq. 23 priority weight
epsilon: 0.5                                   # Eq. 25 reward trade-off (separate from alpha/beta)

# Penalty
penalty_z: 100.0                               # Eq. 25 failure penalty