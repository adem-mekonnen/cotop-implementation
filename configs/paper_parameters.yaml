# ---------------------------------------------------------
# CoTOP Paper Reproduction Parameters
# ---------------------------------------------------------

# --- Paper Table III ---
num_vehicles_range: [10, 30]
num_rsus: 6
vehicle_speed_range: [30.0, 40.0]
rsu_cpu_capacity_range: [1000000000.0, 4000000000.0]
num_tasks_per_vehicle_range: [20, 40]
task_size_range: [2000000.0, 5000000.0]
task_deadline_range: [20.0, 30.0]
rsu_comm_range: 400.0
tx_power_vehicle: 0.01          # 10 dBm
tx_power_rsu: 100.0             # 50 dBm
bandwidth_v2r_range: [20000000.0, 100000000.0]
bandwidth_r2r: 50000000.0
noise_power: 0.001              # 0.001 dBm -> Watts (Wait, 0.001 dBm is 10^(0.001/10) mW = 1 mW = 0.001 Watts? Yes)
fixed_loss_k: 1000.0            # 30 dB -> 10^(30/10) = 1000
path_loss_factor: 2.0

# --- Paper Section III-F ---
max_task_cpu: 10.0              # Mcycles (Average computation demand per task phi_bar is 10 Mcycles)

# --- Paper Eq. 11 / Energy Model ---
compute_power_rsu: 50.0         # Implementation assumption - not explicitly specified in paper (E_RSU computation power)

# --- Paper Eq. 23 / Task Priority ---
alpha: 0.3                      # Paper Section V-C (hyperparameter analysis)
beta: 0.7                       # Paper Section V-C

# --- Paper Eq. 25 / Reward ---
epsilon: 0.5                    # Paper formulation trade-off (implementation assumption on exact value)
penalty_z: 100.0                # Penalty Z for delay > tolerance
